name: ci

# This repo had no workflows at all, while CLAUDE.md stated that CI must run lint, format
# check, typecheck, Vitest, `next build` and Playwright on every PR. None of it ran, so nothing
# gated this repo: a change that broke the build, or re-protected a public marketing route,
# reached main unchallenged.
#
# This is the honest subset - the gates that can run against what the repo actually contains
# today. Vitest and Playwright are deliberately absent: there is no test tooling and no test
# files, and a job that runs zero tests and reports green is worse than no job, because it
# looks like coverage. Adding them is separate work.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to match the Dockerfile. On Node 25 the build compiles, generates all 57
          # static pages, and then fails writing standalone output because
          # routes-manifest.json is never emitted; next's `engines` allows >=18.17.0, so
          # nothing warns you. CI must use the version production builds with.
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint

  room-a11y:
    # The meeting room's accessibility gate (polish program, Phase 0): the real <MeetingRoom /> in
    # a real Chromium via Playwright component testing, with the gateway, Clerk and LiveKit mocked
    # at the edges (tests/e2e/playwright-ct.config.ts). axe (WCAG 2.1 A/AA, contrast in light and
    # dark), the keyboard path through the controls and the panel, shortcuts that can be turned
    # off. Needs no backend and no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: room-a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    # Proves the image production runs can actually be built, on every PR rather than at deploy
    # time. Clerk validates its publishable key at BUILD time and its provider wraps the root
    # layout, so prerendering any page - marketing included - needs real keys; they are build
    # args and are not baked into the runtime image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build but never push: a fork PR could otherwise put an unreviewed image on the
          # tag the VPS pulls.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            API_GATEWAY_URL=${{ vars.API_GATEWAY_URL }}
            NEXT_PUBLIC_APP_HOST=${{ vars.NEXT_PUBLIC_APP_HOST }}
            NEXT_PUBLIC_MARKETING_ORIGIN=${{ vars.NEXT_PUBLIC_MARKETING_ORIGIN }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
            NEXT_PUBLIC_REALTIME_WS_URL=${{ vars.NEXT_PUBLIC_REALTIME_WS_URL }}
          tags: |
            ghcr.io/mytheus-ai/mytheus-ui:${{ github.sha }}
            ghcr.io/mytheus-ai/mytheus-ui:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [quality, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: configure ssh
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: deploy
        # No command argument: the key's forced command in authorized_keys decides what runs.
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=30 \
              root@${{ secrets.VPS_HOST }}
